name: Release Readest Remote

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: readest-remote-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  NDK_VERSION: '28.2.13676358'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/readest-app/package.json').version")
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == 'tag' && "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"

  test-web:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color
      - name: Install dependencies and browser
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
          pnpm --filter @readest/readest-app exec playwright install --with-deps chromium
      - name: Install KOReader test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libsqlite3-dev
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install lsqlite3complete
      - name: Lint and unit tests
        run: |
          pnpm lint
          pnpm test -- --run --maxWorkers=4
      - name: Browser and companion tests
        working-directory: apps/readest-app
        run: |
          pnpm test:browser
          pnpm test:extension
          pnpm lint:lua
          pnpm test:lua
      - name: Calibre tests
        working-directory: apps/readest-calibre-plugin
        run: python3 -m unittest discover -s tests -v

  test-tauri:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: readest-remote-release-tests
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Rust gates
        run: |
          cargo fmt -p Readest -- --check
          cargo clippy -p Readest --no-deps -- -D warnings
          cargo test -p Readest --lib
      - name: Tauri WebDriver tests
        working-directory: apps/readest-app
        run: xvfb-run pnpm test:tauri

  build-web-components:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Build static Web package
        working-directory: apps/readest-app
        run: pnpm build-web-static
      - name: Package Web and companion artifacts
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          mkdir -p release
          (cd apps/readest-app/out && zip -qr "$GITHUB_WORKSPACE/release/Readest-Remote_${version}_web.zip" .)
          pnpm --filter @readest/send-to-readest-extension zip
          cp "apps/readest-app/extensions/send-to-readest/Readest-Remote_${version}_browser-extension.zip" release/
          make -C apps/readest-calibre-plugin zip
          cp "apps/readest-calibre-plugin/dist/Readest-Remote_${version}_calibre-plugin.zip" release/
          node apps/readest.koplugin/scripts/build-koplugin.mjs \
            --version "$version" \
            --out "release/Readest-Remote_${version}_koreader-plugin.zip"
          node -e "const m=require('./apps/readest-app/out/manifest.json'); if(m.name!=='Readest Remote') throw new Error('bad PWA name')"
          test -s apps/readest-app/out/sw.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-components
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # workerd has no win32-arm64 postinstall package. The hosted ARM64
          # runner supports x64 Node emulation while Rust still targets ARM64.
          architecture: x64
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows-${{ matrix.arch }}
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Build Windows NSIS package
        working-directory: apps/readest-app
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles nsis
      - name: Stage and inspect Windows artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $root = Join-Path $env:GITHUB_WORKSPACE "target/$env:RUST_TARGET/release"
          $binary = Join-Path $root 'readest-remote.exe'
          $installer = Get-ChildItem (Join-Path $root 'bundle/nsis') -Filter '*-setup.exe' | Select-Object -First 1
          if (-not (Test-Path $binary) -or -not $installer) { throw 'Windows bundle output missing' }
          $info = (Get-Item $binary).VersionInfo
          $windowsVersion = $env:RELEASE_VERSION -replace '-r([0-9]+)$', '-$1'
          if ($info.ProductName -ne 'Readest Remote' -or $info.ProductVersion -ne $windowsVersion) {
            throw "Unexpected Windows identity: $($info.ProductName) $($info.ProductVersion)"
          }
          Copy-Item $installer.FullName "release/Readest-Remote_${env:RELEASE_VERSION}_windows-${env:RELEASE_ARCH}-setup.exe"
      - name: Build Windows portable executable
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_PORTABLE_APP: 'true'
        run: pnpm tauri build --target ${{ matrix.rust_target }} --no-bundle
      - name: Stage portable executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/$env:RUST_TARGET/release/readest-remote.exe"
          if (-not (Test-Path $binary)) { throw 'Windows portable binary missing' }
          Copy-Item $binary "release/Readest-Remote_${env:RELEASE_VERSION}_windows-${env:RELEASE_ARCH}-portable.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-${{ matrix.arch }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
          cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev 162626969b382d52faebdf6c7264460bd9a47d1f --force
      - name: Pin portable AppImage bundler helper
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$cache_dir"
          curl -fsSL --retry 3 -o "$cache_dir/quick-sharun.sh" \
            'https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/b3a9e985cdedf7efa81d172f182cd13983743147/useful-tools/quick-sharun.sh'
          chmod +x "$cache_dir/quick-sharun.sh"
      - name: Build Linux packages
        working-directory: apps/readest-app
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: 'true'
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles appimage,deb
      - name: Stage and inspect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          root="target/${{ matrix.rust_target }}/release/bundle"
          appimage=$(find "$root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find "$root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$appimage" && test -n "$deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          mkdir -p release
          cp "$appimage" "release/Readest-Remote_${version}_linux-${{ matrix.arch }}.AppImage"
          cp "$deb" "release/Readest-Remote_${version}_linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-universal
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Build unsigned universal DMG
        working-directory: apps/readest-app
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Stage and inspect macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount="$RUNNER_TEMP/readest-remote-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app=$(find "$mount" -maxdepth 1 -type d -name '*.app' -print -quit)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'io.github.wenhe233.readestremote'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          mkdir -p release
          cp "$dmg" "release/Readest-Remote_${version}_macos-universal.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android and Rust toolchains
        run: sdkmanager "ndk;${NDK_VERSION}" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android-release
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Initialize Android project
        working-directory: apps/readest-app
        shell: bash
        run: |
          set -euo pipefail
          # Only customized Android files are tracked. Generate the Gradle
          # scaffold on a clean runner, then restore Remote customizations.
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
      - name: Configure Readest Remote release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing Android signing secret: $name" >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/readest-remote-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > apps/readest-app/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed Android APKs
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          mkdir -p "$GITHUB_WORKSPACE/release"
          # Tauri 2 can return a non-zero status after Gradle has successfully
          # emitted the APK. A clean runner has no stale output, and the next
          # step independently verifies identity and the pinned certificate.
          if ! pnpm tauri android build --apk --ci; then
            echo 'Tauri returned non-zero; accepting only a fresh, verifiable APK.' >&2
          fi
          universal=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -type f -name '*.apk' -print -quit)
          test -n "$universal" && test -s "$universal"
          cp "$universal" "$GITHUB_WORKSPACE/release/Readest-Remote_${version}_android-universal.apk"
          # The universal build has already compiled and staged every JNI ABI;
          # package the arm64 flavor directly instead of rebuilding Next/Rust.
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleArm64Release \
            -x :app:rustBuildArm64Release --no-daemon
          arm64=$(find src-tauri/gen/android/app/build/outputs/apk/arm64/release -type f -name '*.apk' -print -quit)
          test -n "$arm64" && test -s "$arm64"
          cp "$arm64" "$GITHUB_WORKSPACE/release/Readest-Remote_${version}_android-arm64.apk"
      - name: Run Gradle tests and verify APK identity
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME}"
          apps/readest-app/src-tauri/gen/android/gradlew -p apps/readest-app/src-tauri/gen/android test --no-daemon
          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -n "$EXPECTED_CERT_SHA256" || { echo 'Missing ANDROID_RELEASE_CERT_SHA256' >&2; exit 1; }
          for apk in release/*.apk; do
            badging=$($aapt dump badging "$apk")
            grep -q "package: name='io.github.wenhe233.readestremote' versionCode='12001001' versionName='${{ needs.metadata.outputs.version }}'" <<< "$badging"
            grep -q "application-label:'Readest Remote'" <<< "$badging"
            if grep -q 'com.android.vending.BILLING' <<< "$badging"; then
              echo "Unexpected Play Billing permission in $apk" >&2
              exit 1
            fi
            actual=$($apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$actual" = "$expected"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-ios:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ios-arm64
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors
      - name: Initialize iOS project
        working-directory: apps/readest-app
        shell: bash
        run: |
          set -euo pipefail
          # The generated base Info.plist is intentionally ignored. Recreate
          # the Apple scaffold, then restore tracked Remote customizations.
          rm -rf src-tauri/gen/apple
          pnpm tauri ios init --ci --skip-targets-install
          git checkout .
      - name: Build unsigned iOS archive
        working-directory: apps/readest-app
        shell: bash
        run: |
          set -euo pipefail
          # The Xcode build phase asks the Tauri CLI options server for its
          # release configuration. A direct xcodebuild invocation cannot
          # provide that server, so use Tauri's supported unsigned path.
          pnpm tauri ios build --ci --no-sign
          ipa=$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          test -s "$ipa"
          stage="$RUNNER_TEMP/ipa-inspect"
          mkdir -p "$stage"
          unzip -q "$ipa" -d "$stage"
          app=$(find "$stage/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          info="$app/Info.plist"
          apple_version='${{ needs.metadata.outputs.version }}'
          apple_version="${apple_version%%-*}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'io.github.wenhe233.readestremote'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$apple_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = '12001001'
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$ipa" "$GITHUB_WORKSPACE/release/Readest-Remote_${{ needs.metadata.outputs.version }}_ios-arm64.ipa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs:
      - metadata
      - test-web
      - test-tauri
      - build-web-components
      - build-windows
      - build-linux
      - build-macos
      - build-android
      - build-ios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Verify matrix and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.mjs release '${{ needs.metadata.outputs.version }}'
          (cd release && sha256sum Readest-Remote_* | sort -k2 > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-remote-${{ needs.metadata.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - metadata
      - aggregate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readest-remote-${{ needs.metadata.outputs.version }}
          path: release
      - name: Create formal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create '${{ needs.metadata.outputs.tag }}' release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'Readest Remote ${{ needs.metadata.outputs.version }}' \
            --generate-notes
